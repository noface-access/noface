<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NØFACE</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#fff;
font-family:Arial, Helvetica, sans-serif;
overflow:hidden;
}

.screen{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
text-align:center;
padding:20px;
}

.logo{
font-size:120px;
margin-bottom:30px;
font-weight:300;
}

.title{
font-size:20px;
letter-spacing:6px;
margin-bottom:20px;
font-weight:400;
}

.text{
max-width:600px;
line-height:1.8;
opacity:.8;
margin-bottom:15px;
}

.button{
margin-top:25px;
padding:14px 35px;
border:1px solid white;
background:none;
color:white;
cursor:pointer;
font-size:14px;
letter-spacing:2px;
text-decoration:none;
transition:0.3s;
}

.button:hover{
background:white;
color:black;
}

.hidden{
display:none;
}

.footer{
margin-top:40px;
font-size:12px;
opacity:.4;
letter-spacing:2px;
}

.fade{
animation:fadeIn .8s ease;
}

@keyframes fadeIn{
from{
opacity:0;
}
to{
opacity:1;
}
}

</style>
</head>

<body>

<!-- PANTALLA 1 -->

<div id="screen1" class="screen">

<div class="logo">Ø</div>

<div class="title">
SIGNAL DETECTED.
</div>

<button class="button" onclick="enterSite()">
CONTINUE
</button>

</div>

<!-- PANTALLA 2 -->

<div id="screen2" class="screen hidden fade">

<div class="logo">Ø</div>

<div class="title">
IDENTITY REMOVED.
</div>

<div class="text">
NØFACE is a limited streetwear project built around anonymity, identity and trace.
</div>

<div class="text">
Not everyone enters.
</div>

<a href="https://forms.gle/a7iCTqewmw7rtdPV7" class="button" target="_blank">
REQUEST ACCESS
</a>

<div class="footer">
NØFACE
</div>

</div>

<script>

function enterSite(){
document.getElementById('screen1').style.display='none';
document.getElementById('screen2').classList.remove('hidden');
}

</script>

</body>
</html>
